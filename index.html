<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>La Choulette</title>
  <link rel="stylesheet" href="style.css" />

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.1/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.1/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="webgl"></canvas>

  <section class="panel hero">
    <div class="content">
      <h1>La Choulette</h1>
      <p>Scroll vers le bas pour animer la bouteille.</p>
    </div>
  </section>

  <section class="panel">
    <div class="content">
      <h2>Bière blanche artisanale</h2>
      <p>Rotation, déplacement et zoom caméra au scroll.</p>
    </div>
  </section>

  <section class="panel">
    <div class="content">
      <h2>Zoom final</h2>
      <p>La caméra se rapproche pendant que la bouteille tourne.</p>
    </div>
  </section>

  <script type="module" src="./script.js"></script>
</body>
</html>
